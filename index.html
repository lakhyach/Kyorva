<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clayo Analytics — Real-time financial insights</title>
    <meta name="description" content="Clayo is a financial analytics platform concept: real-time insight, customizable reports, and the same clarity on every screen." />
    <meta name="author" content="Lakhyajit Changmai" />
    <link rel="canonical" href="https://clayo-analytics.vercel.app/" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0B0B" />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clayo Analytics" />
    <meta property="og:title" content="Clayo Analytics — Real-time financial insights" />
    <meta property="og:description" content="Real-time insight, customizable reports, and the same clarity on every screen." />
    <meta property="og:url" content="https://clayo-analytics.vercel.app/" />
    <meta property="og:image" content="https://clayo-analytics.vercel.app/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clayo Analytics — Real-time financial insights" />
    <meta name="twitter:description" content="Real-time insight, customizable reports, and the same clarity on every screen." />
    <meta name="twitter:image" content="https://clayo-analytics.vercel.app/og.svg" />

    <!-- Prevent a wrong-theme flash before React mounts. Mirrors App.jsx
         resolution order exactly: saved choice first, OS preference second. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('clayo-theme');
          var d = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.style.background = d ? '#0B0B0B' : '#ffffff';
          document.documentElement.style.colorScheme = d ? 'dark' : 'light';
        } catch (e) { /* private mode etc. — default paint is fine */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
